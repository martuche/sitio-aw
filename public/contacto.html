    <!-- Formulario de contacto -->
<section class="fondo-celeste-claro seccion">
    <h2 class="texto-azul-oscuro">Formulario</h2>

    <form id="formularioContacto"
          action="php/iniciarContacto.php"
          method="POST">

        <div>
            <label for="nombre">Nombre/s:</label>
            <input type="text" id="nombre" name="nombre" maxlength="100" required>
        </div>

        <div>
            <label for="apellido">Apellido/s:</label>
            <input type="text" id="apellido" name="apellido" maxlength="100" required>
        </div>

        <div>
            <label for="mail">Correo electrónico:</label>
            <input type="email" id="mail" name="mail" maxlength="200" required>
            <span id="email-error" class="error-message"></span>
        </div>

        <div>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" maxlength="1000" rows="5" required></textarea>
        </div>
        <div class="containerButton">
            <button type="submit" class="btn">Enviar</button>
        </div>
    </form>
</section>
